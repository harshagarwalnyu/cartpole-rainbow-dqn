[project]
name = "rl-cartpole"
version = "0.1.0"
description = "DQN agent solving CartPole-v1 from scratch with NumPy"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# The notebook stitches four standalone modules (network/replay_buffer/dqn_agent/train)
# into one file as separate cells, each keeping its own module docstring + `from __future__`
# header by design; ruff lints the concatenated cells as one file, so E402/F404/F811 fire
# on that intentional structure rather than a real bug.
[tool.ruff.lint.per-file-ignores]
"Rainbow_DQN_CartPole.ipynb" = ["E402", "F404", "F811"]
